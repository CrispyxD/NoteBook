{% extends 'components/base.html' %}

{% block body %}
<div class="container py-5">
    <a href="{% url 'notes_details' notes.id %}" class="link-success fw-semibold text-decoration-none mb-4 d-inline-flex">
        <i class="fa-solid fa-arrow-left me-2" aria-hidden="true"></i>Back to note
    </a>
    <div class="mb-4">
        <h1 class="display-6 fw-bold mt-2 mb-2">Edit your note.</h1>
    </div>

    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 mx-auto" style="max-width: 850px;">
        <form method="post">
            {% csrf_token %}
            <div class="row g-4">
                <div class="col-12 col-md-6">
                    <label for="note-title" class="form-label fw-semibold">Title <span class="text-danger">*</span></label>
                    <input id="note-title" value="{{ notes.title }}" name="title" type="text"
                        class="form-control form-control-lg" placeholder="Give your note a name" required>
                </div>
                <div class="col-12 col-md-6">
                    <label for="note-author" class="form-label fw-semibold">Author <span class="text-danger">*</span></label>
                    <input id="note-author" value="{{ notes.author }}" name="author" type="text"
                        class="form-control form-control-lg" placeholder="Your name" required>
                </div>
                <div class="col-12">
                    <label for="note-text" class="form-label fw-semibold">Your note</label>
                    <textarea id="note-text" name="Text" class="form-control" rows="9">{{ notes.Text }}</textarea>
                </div>
                <div class="col-12">
                    <label for="note-category" class="form-label fw-semibold">Category</label>
                    <select id="note-category" name="category" class="form-select">
                        {% for cate in category %}
                        <option value="{{ cate.id }}"{% if notes.category.id == cate.id %} selected{% endif %}>{{ cate.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-12">
                    <label for="note-description" class="form-label fw-semibold">Description</label>
                    <textarea id="note-description" name="description" required class="form-control" rows="3"
                        placeholder="Add a short summary or reminder">{{ notes.description }}</textarea>
                </div>
                <div class="col-12 d-flex flex-column-reverse flex-sm-row justify-content-end gap-2 pt-2">
                    <a href="{% url 'notes_details' notes.id %}" class="btn btn-outline-dark rounded-pill px-4">Cancel</a>
                    <button type="submit" class="btn btn-primary rounded-pill px-4">
                        <i class="fa-regular fa-floppy-disk me-2" aria-hidden="true"></i>Save changes
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
