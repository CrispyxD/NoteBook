{% extends 'components/base.html' %}

{% block body %}
<div class="container flex-grow-1 d-flex align-items-center py-5">
    <div class="row g-0 overflow-hidden bg-white border rounded-4 shadow-sm w-100 mx-auto" style="max-width: 1000px;">
        <section class="col-lg-5 bg-success-subtle p-4 p-md-5 d-flex flex-column justify-content-between">
            <div>
                <span class="d-inline-flex align-items-center justify-content-center rounded-3 border bg-white text-success"
                    style="width: 3rem; height: 3rem;" aria-hidden="true"><i class="fa-regular fa-bookmark"></i></span>
                <h1 class="display-6 fw-bold mt-2 mb-3">Good to have you back.</h1>
                <p class="text-secondary mb-0">Pick up where you left off and keep your best ideas close.</p>
            </div>
        </section>

        <section class="col-lg-7 p-4 p-md-5">
            <div class="mx-auto" style="max-width: 420px;">
                <span class="small fw-bold text-success text-uppercase">Welcome back</span>
                <h2 class="h2 fw-bold mt-2 mb-2">Sign in</h2>
                <p class="text-secondary mb-4">Enter your details to access your notes.</p>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="Username" class="form-label fw-semibold">Username</label>
                        <input id="Username" name="username" type="text" class="form-control form-control-lg" placeholder="Your username" required>
                    </div>
                    <div class="mb-3">
                        <label for="login-password" class="form-label fw-semibold">Password</label>
                        <input id="login-password" name="password" type="password" class="form-control form-control-lg"
                            placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg rounded-pill w-100">
                        Sign in <i class="fa-solid fa-arrow-right ms-2" aria-hidden="true"></i>
                    </button>
                </form>

                <p class="text-center text-secondary mt-4 mb-0">
                    New to NoteBook? <a class="link-success fw-semibold" href="{% url 'register' %}">Create an account</a>
                </p>
            </div>
        </section>
    </div>
</div>
{% endblock %}
